/* //## 변경: 별도 설치 없이 휴대폰 브라우저에서 실행하는 반응형 게임 화면. */
:root{color-scheme:dark;--bg:#111224;--panel:#20213a;--line:#393b58;--ink:#f6f2ff;--muted:#adb0ca;--lav:#bcabff;--mint:#86eccb;--gold:#ffda96;--pink:#ffa8bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 0,#30284a,transparent 55%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);line-height:1.65}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation;color:inherit;border:1px solid var(--line);background:#2b2d49;border-radius:15px;padding:12px 16px;min-height:46px}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.35;letter-spacing:-.04em;word-break:keep-all}h1{font-size:36px}h2{font-size:23px}h3{font-size:17px}small,.muted{color:var(--muted)}small{font-size:12px}.shell{max-width:920px;margin:auto;padding:22px 22px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:24px}.brand{border:0;background:transparent;text-align:left;padding:0;font-weight:800}.brand b{font-size:24px;color:var(--lav);margin-right:8px}.wallet,.tag{font-size:12px;padding:6px 10px;background:#292a43;border-radius:30px;border:1px solid var(--line)}.wallet{color:var(--gold)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.primary{background:var(--lav);color:#231d3c;border-color:var(--lav);font-weight:800}.secondary{background:transparent}.grow{flex:1}.full{width:100%}.section{margin:26px 0 13px}.hero{position:relative;overflow:hidden;min-height:300px;border:1px solid #55466b;border-radius:28px;padding:30px;background:linear-gradient(120deg,#38304e,#22233e)}.hero h1{max-width:65%;margin-top:17px}.hero h1 em{font-style:normal;color:var(--gold)}.hero p{margin:14px 0 24px;font-size:13px;max-width:65%;color:#d0c8e1}.eyebrow{font-size:10px;letter-spacing:.12em;color:var(--mint);text-transform:uppercase}.hero-actions{display:flex;gap:9px;position:relative;z-index:2}.art{position:absolute;right:35px;top:95px}.creature{position:relative;display:grid;place-items:center;width:112px;height:112px;background:#bfa8ff;border:5px solid #393044;border-radius:43% 43% 38% 38%;box-shadow:0 16px 0 -4px #090c1e55;animation:bob 2.8s ease-in-out infinite;font-size:62px}.creature:after{content:'✦';position:absolute;font-size:28px;color:var(--gold);right:-24px;top:-28px}.glow{filter:drop-shadow(0 0 18px #ffd88d)}.enemy{background:#eaa8bc;animation-delay:-1.5s}.enemy:after{content:''}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:21px;padding:20px}.stage{display:block;text-align:left;width:100%;transition:border-color .15s}.stage:hover{border-color:var(--lav)}.stage .icon{font-size:28px;display:block;margin-bottom:10px;color:var(--lav)}.stage small{display:block;font-size:11px;margin:6px 0 10px}.bar{height:6px;background:#38394f;border-radius:20px;overflow:hidden}.bar>i{display:block;background:linear-gradient(90deg,var(--lav),var(--mint));height:100%;width:0;transition:width .25s}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;text-align:center}.stats>div{padding:8px 2px}.stats b{display:block;font-size:22px}.stats small{font-size:10px}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mode{text-align:left}.mode span{display:block;color:var(--muted);font-size:11px;margin-top:6px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#191a30ed;border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:5px;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;flex:1;max-width:150px;font-size:12px;padding:9px 3px}.nav button.active{color:var(--lav);background:#2f2b47}.battle{border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at bottom,#39365e,#1c2037);padding:16px 20px;margin:14px 0}.fighters{height:155px;display:flex;align-items:center;justify-content:space-around;gap:35px}.fighters .creature{width:90px;height:90px;font-size:48px}.versus{font-size:18px;color:var(--gold);font-weight:900}.health{color:var(--pink);font-size:12px}.combo{color:var(--gold);font-size:13px}.question{white-space:pre-line;font-size:21px;margin:16px 0 20px;line-height:1.55;overflow-wrap:anywhere}.answers{display:grid;gap:10px}.answer{text-align:left;white-space:pre-line;background:#282a45}.selected{border:2px solid var(--lav);background:#3c3458;padding:11px 15px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{min-height:42px;padding:8px 12px;border-radius:11px}.build{padding:14px;min-height:76px;border:1px dashed #70688c;border-radius:14px;margin:0 0 14px;background:#171829}.build small{align-self:center}textarea{display:block;width:100%;min-height:122px;resize:vertical;padding:15px;color:var(--ink);background:#171829;border:1px solid #55536f;border-radius:15px;font-size:16px;line-height:1.7}.actions{display:flex;gap:8px;margin-top:18px}.feedback{margin-top:20px;padding:20px;border-radius:17px;border:1px solid var(--mint);background:#1b3936}.feedback.bad{border-color:var(--pink);background:#3b293a}.feedback h3{color:var(--mint);margin-bottom:8px}.feedback.bad h3{color:var(--pink)}.solution{white-space:pre-line;font-weight:700;overflow-wrap:anywhere;margin:9px 0}.explain{font-size:13px;color:#ddd9e7;white-space:pre-line}.feedback button{margin-top:16px}.hint{margin-top:12px;color:var(--gold);font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;padding:15px 0}.tabs button{white-space:nowrap;min-height:40px;font-size:12px}.booktext{white-space:pre-line;font-size:14px}.booktext strong{color:var(--gold)}.bookcard{margin:12px 0}.bookcard h3{color:var(--lav);margin-bottom:10px}.eng{font-size:18px;letter-spacing:.01em}.sentence{margin:12px 0}.sentence .eng{margin:12px 0}.result{text-align:center;padding:32px 20px}.result .score{font-size:68px;font-weight:900;color:var(--gold);line-height:1.3}.peticon{font-size:42px;margin-bottom:8px;display:block}.center{text-align:center}#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#ede7ff;color:#241f38;padding:12px 20px;border-radius:14px;z-index:50;max-width:90%;font-size:13px;box-shadow:0 8px 30px #0006}#toast:empty{display:none}.warn{padding:10px;background:#544328;border-radius:12px;font-size:12px;margin-bottom:15px}.note{font-size:11px;line-height:1.8;color:var(--muted);margin-top:18px}.flash{animation:hit .38s ease-out}.particle{position:fixed;pointer-events:none;z-index:40;color:var(--gold);animation:fall .9s linear forwards}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes hit{40%{transform:translateX(-10px);filter:brightness(1.8)}}@keyframes fall{to{transform:translateY(160px) rotate(160deg);opacity:0}}@media(min-width:760px){.answers{grid-template-columns:1fr 1fr}.hero{min-height:310px}.art{right:90px;top:85px}.art .creature{width:145px;height:145px;font-size:80px}}@media(max-width:560px){.shell{padding:18px 16px 110px}.hero{padding:24px 20px}.hero h1{font-size:30px;max-width:72%}.hero p{max-width:65%;font-size:12px}.art{right:14px;top:102px}.art .creature{width:86px;height:91px;font-size:48px}.hero-actions .primary{flex:1}.hero-actions button{font-size:13px;padding:12px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px}.stage:last-child{grid-column:1/-1}.question{font-size:19px}.wallet{font-size:10px}.fighters{height:135px}.fighters .creature{width:78px;height:82px;font-size:42px}.tag{font-size:10px}.actions button{font-size:13px;padding:11px}.modes{gap:9px}.mode{padding:14px;font-size:13px}.mode span{font-size:10px}h2{font-size:21px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main id="app" class="shell"><h1>시제 퀘스트</h1><p>게임을 불러오고 있어요.</p><p>문법·힌트·예문 전체를 연습하는 150문항 암기 게임</p><noscript>게임 실행을 위해 JavaScript를 허용해 주세요.</noscript><button onclick="location.reload()">다시 열기</button></main><div id="toast" role="status" aria-live="polite"></div>
<script src="q-0.js"></script><script src="q-1.js"></script><script src="q-2.js"></script><script>
(()=>{'use strict';
//## 변경: 기존 150문항을 복원한다. 그림 파일·로그인·서버 저장은 사용하지 않는다.
const root=document.getElementById('app');if(!window.TQROWS||TQROWS.length!==150){root.innerHTML='<h1>연결을 확인해 주세요.</h1><p>문항을 모두 불러오지 못했어요.</p><button onclick="location.reload()">다시 열기</button>';return;}
const Q=TQROWS.map(([id,unit,type,prompt,answer,options,explain,extra])=>({id,unit,type,prompt,answer,options,tokens:options,explain,...extra})),MAP=Object.fromEntries(Q.map(q=>[q.id,q]));
const UNITS=[['form','✦','시제의 문','정의 · 네 가지 공식','시간 도둑'],['exp','♧','경험의 숲','해 본 적 · 힌트 7개','망각 버섯'],['done','⚒','완료의 공방','이미 · 막 · 아직 · 최근','태엽 골렘'],['cont','≈','계속의 강','for · since · 기간','물방울 유령'],['result','♜','결과의 성','현재의 상태 · 과거분사','열쇠 먹깨비'],['past','◷','과거의 균열','현재완료 vs 과거','과거의 그림자'],['sentence','✎','예문의 탑','9개 예문 · 통째로 쓰기','백지 드래곤']];
const PETS=[['🐰','별빛 토끼',0],['🦊','도토리 여우',60],['🐱','달빛 고양이',140],['🐉','꼬마 드래곤',240]];
//## 변경: 원문의 표현과 풀이를 구분하여 도감에 보관한다.
const BOOK={form:'현재완료: 과거에서 시작한 일이 현재에 끝나거나 현재까지 영향을 미칠 때.\n\n형태: have/has + 과거분사(pp)\n부정문: S + have/has + not + pp\nhave not = haven’t / has not = hasn’t\n의문문: Have/Has + S + pp ~?\n수동태: have/has + been + pp (~되어 있다)\n\n[손글씨] 3인칭 단수 → has / 나머지 → have\n의문문은 have/has가 맨 앞으로.\n현재완료와 수동태를 합치면 have/has + been + pp.\n\n[원문 표현] 기본형 옆에는 “~했었다”라고 적혀 있다.\n[풀이] 게임에서는 경험·완료·계속·결과에 맞추어 뜻을 구분한다.',exp:'경험: (특정 시점부터 현재까지) ~해 본 적이 있다.\n\nShe has never visited Paris.\n\nhave/has been to: ~에 가본 적이 있다.\never, never, sometimes, once, twice, three times, often\n\n[손글씨] ever, never의 위치: have/has와 p.p. 사이.\n[뜻풀이] 한 번이라도, 한 번도 ~않다, 때때로, 한 번, 두 번, 세 번, 자주.',done:'완료: (특정 시점에 시작한 일을) ~했다.\n\nHe has already finished his homework.\n\nalready(이미), just(이제 막), yet(아직), lately(최근에)\n\n[손글씨] already, just: have/has와 p.p. 사이. yet: 문장 마지막.\n[보충] yet은 주로 부정문·의문문에 쓰며, 의문문에서는 “벌써/이미”의 뜻으로도 쓰인다. lately만으로 용법을 단정하지 않는다.',cont:'계속: (특정 시점부터 현재까지 계속) ~해 왔다.\n\nI have studied English for three years.\n\nfor, since, How long ~?(얼마나 오래 ~?), so far(지금까지)\n\n[손글씨] How long의 위치: 맨 앞.\n[뜻풀이] for + 기간 / since + 시작 시점\nfor three years: 3년 동안\nsince yesterday: 어제부터',result:'[원문] 결과: (특정 시점 이전에 ~한 결과 특정 시점에) ~인 상태였다.\n\nI have lost my key.\n(특정시점: 잃어버림, 현재: 잃어버림)\n\nlose(lost), go(gone), come(come), sell(sold), buy(bought), break(broken)\n\n[손글씨] have/has gone to: ~에 가고 없다.\n[풀이] 과거의 일로 현재 남아 있는 상태를 살펴본다. 예문에서는 열쇠를 잃어버려 지금 열쇠가 없다.\nbeen to는 가 본 경험, gone to는 가고 없는 상태.',past:'[학습지 본문] 과거시제는 이미 지나간 과거의 동작이나 상태만을 나타내는 반면, 현재완료는 과거에 시작된 일이 현재까지 영향을 미칠 때 사용한다. 따라서 현재완료는 과거의 특정 시점을 나타내는 yesterday, ago, last~, when 등의 표현과 함께 쓰지 않는다.\n\nI went to the theater yesterday.\n나는 어제 그 극장에 갔다.\nI have been to the theater three times so far.\n나는 그 극장에 지금까지 세 번 가 봤다.\n\nDid you visit Busan in 2018? (O)\nHave you visited Busan in 2018? (X)\n\n[손글씨] when + S + V / in + 과거 연도 / 역사적 사실\nI [studied / have studied] English yesterday.\n→ studied\nI [studied / have studied] English since yesterday.\n→ have studied\n\n[보충] 여기서 when은 끝난 과거의 특정 시점을 뜻하는 경우다. for, so far 등은 단서이지 시제·용법을 무조건 정하는 공식은 아니다.'};
const KEY='tense-quest-live-v1',fresh=()=>({version:1,xp:0,coins:0,pet:0,owned:[0],stats:{},session:null,best:0,sound:false});let state=fresh(),storageOK=true,route='home',book='form',hidden=false,report=null,timer=null,audio=null;
//## 변경: 저장이 차단되어도 플레이를 계속하고, 정상 환경에서는 문제 진행까지 자동 저장한다.
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.version===1){state={...fresh(),...raw};state.stats=raw.stats&&typeof raw.stats==='object'?raw.stats:{};state.owned=Array.isArray(raw.owned)?raw.owned.filter(i=>PETS[i]):[0];if(!state.owned.includes(0))state.owned.push(0);if(!state.owned.includes(state.pet))state.pet=0;for(const k of ['xp','coins','best'])state[k]=Math.max(0,Number(state[k])||0);if(state.session&&(!Array.isArray(state.session.queue)||!state.session.queue.every(id=>MAP[id])||!MAP[state.session.queue[state.session.i]]))state.session=null;}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').replace(/[‘’`]/g,"'").toLowerCase().replace(/[.,!?~:;()[\]“”"]/g,'').replace(/\s+/g,' ').trim(),compact=s=>norm(s).replace(/\s/g,'');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const mastered=q=>!!state.stats[q.id]?.done,level=()=>Math.floor(state.xp/120)+1,current=()=>MAP[state.session?.queue[state.session.i]],answer=q=>Array.isArray(q.answer)?q.answer.join(', '):q.answer;
function toast(t){clearTimeout(timer);document.getElementById('toast').textContent=t;timer=setTimeout(()=>document.getElementById('toast').textContent='',2800);}
function sound(ok){if(!state.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?660:190;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.start();o.stop(audio.currentTime+.2);}catch(e){}}
function particles(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<9;i++){const n=document.createElement('span');n.className='particle';n.textContent=i%2?'✦':'✧';n.style.cssText=`left:${15+Math.random()*70}%;top:${15+Math.random()*30}%;font-size:${15+Math.random()*15}px`;document.body.appendChild(n);setTimeout(()=>n.remove(),950);}}
function top(){return `<header class="top"><button class="brand" data-a="home"><b>✦</b>시제 퀘스트</button><div class="wallet">LV.${level()}　✧ ${state.coins}</div></header>${storageOK?'':'<p class="warn">자동 저장이 제한된 환경이에요. 탭을 닫으면 기록이 사라질 수 있어요.</p>'}`;}
function nav(){return '<nav class="nav" aria-label="주 메뉴">'+[['home','⌂ 모험'],['book','▤ 암기 도감'],['review','↻ 오답'],['pets','✦ 내 캐릭터']].map(([a,t])=>`<button data-a="${a}" class="${route===a?'active':''}">${t}</button>`).join('')+'</nav>';}
function go(r){route=r;render();window.scrollTo(0,0);}
function render(){root.innerHTML=top()+({home:home,book:bookView,review:review,pets:pets,play:play,result:result}[route]||home)()+nav();}
function home(){const done=Q.filter(mastered).length,ss=Q.filter(q=>q.fullSentence);return `<section class="hero"><div class="eyebrow">문법 + 힌트 + 손글씨 예문까지</div><h1>한 장을 통째로,<br><em>내 기억으로.</em></h1><p>시간 도둑이 흩뜨린 현재완료!<br>공식부터 예문까지 되찾는 암기 모험.</p><div class="art"><div class="creature">${PETS[state.pet][0]}</div></div><div class="hero-actions"><button class="primary" data-a="main">${state.session?'이어서 모험하기':'모험 시작'} →</button><button class="secondary" data-a="book">먼저 읽기</button></div></section><section class="card stats"><div><b>${done}<small> / 150</small></b><small>힌트 없이 정답</small></div><div><b>${ss.filter(mastered).length}<small> / 9</small></b><small>예문 직접 쓰기</small></div><div><b>${state.best}<small>점</small></b><small>백지 도전 최고점</small></div></section><div class="row section"><h2>일곱 개의 기억</h2><small>한 번에 10문항</small></div><section class="grid">${UNITS.map(([id,icon,name,sub],i)=>{const list=Q.filter(q=>q.unit===id&&!q.id.startsWith('recall')),n=list.filter(mastered).length;return `<button class="card stage" data-a="unit" data-id="${id}"><span class="icon">${icon}</span><small>STAGE 0${i+1}</small><h3>${name}</h3><small>${sub}</small><div class="row"><small>${n} / ${list.length}</small><span>→</span></div><div class="bar"><i style="width:${n/list.length*100}%"></i></div></button>`;}).join('')}</section><h2 class="section">실력을 꺼내는 도전</h2><div class="modes">${[['sentence','✎ 예문 직접 쓰기','인쇄 7개 + 손글씨 2개'],['exam','♜ 백지 도전','선택지 없는 34문항'],['raid','⚔ 전범위 보스','150문항 모두 도전'],['review','↻ 오답 구조대','틀렸던 기억만 다시']].map(([a,t,d])=>`<button class="card mode" data-a="${a}">${t}<span>${d}</span></button>`).join('')}</div><p class="note">선택 → 문장 조립 → 직접 쓰기. 정답 5연속이면 각성! 틀린 문제는 뒤에서 다시 만나요. 하트가 없어져도 무료로 회복해 계속 학습할 수 있어요.</p>`;}
function start(mode,unit){if(state.session&&!confirm('현재 도전 대신 새 도전을 시작할까요? 이미 얻은 기록은 남아요.'))return;let list,title;
if(mode==='unit'){list=shuffle(Q.filter(q=>q.unit===unit&&!q.id.startsWith('recall'))).sort((a,b)=>Number(mastered(a))-Number(mastered(b))).slice(0,10);title=UNITS.find(u=>u[0]===unit)[2];}
else if(mode==='sentence'){list=Q.filter(q=>q.fullSentence);title='예문 9개 · 직접 쓰기';}
else if(mode==='exam'){list=Q.filter(q=>q.id.startsWith('recall')).concat(Q.filter(q=>q.type==='list'),Q.filter(q=>q.fullSentence));title='백지 도전 · 34문항';}
else if(mode==='review'){list=shuffle(Q.filter(q=>state.stats[q.id]?.review));title='오답 구조대';}
else{list=shuffle(Q);title='전범위 보스 · 150문항';}
if(!list.length){toast('복습할 오답이 없어요. 모험을 시작해 보세요.');return;}
state.session={mode,title,queue:list.map(q=>q.id),initial:list.map(q=>q.id),i:0,attempts:{},right:0,combo:0,max:0,hp:5,earned:0,selected:[],picked:[],input:'',feedback:null,help:false};prepare();save();go('play');}
function prepare(){const s=state.session,q=current();s.selected=[];s.picked=[];s.input='';s.feedback=null;s.help=false;s.options=shuffle(q.options.map((_,i)=>i));}
function play(){const s=state.session,q=current();if(!s||!q)return home();const f=s.feedback,progress=s.initial.filter(id=>s.attempts[id]).length/s.initial.length*100,u=UNITS.find(u=>u[0]===q.unit),labels={choice:'선택의 마법',multi:'모두 고르기',order:'문장 조립',type:'직접 꺼내 쓰기',list:'힌트 전부 쓰기'};let body='';
if(q.type==='choice'||q.type==='multi')body=`<div class="answers">${s.options.map(i=>`<button class="answer ${s.selected.includes(i)?'selected':''}" aria-pressed="${s.selected.includes(i)}" data-a="select" data-i="${i}" ${f?'disabled':''}>${q.type==='multi'?(s.selected.includes(i)?'☑ ':'☐ '):''}${E(q.options[i])}</button>`).join('')}</div>`;
else if(q.type==='order')body=`<div class="build chips">${s.picked.length?s.picked.map((i,j)=>`<button data-a="unpick" data-i="${j}" ${f?'disabled':''}>${E(q.tokens[i])}</button>`).join(''):'<small>아래 단어를 눌러 문장을 완성해요.</small>'}</div><div class="chips">${s.options.map(i=>`<button data-a="pick" data-i="${i}" ${s.picked.includes(i)||f?'disabled':''}>${E(q.tokens[i])}</button>`).join('')}</div>`;
else body=`<textarea id="answer-input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="답 입력" placeholder="${E(q.placeholder||'답을 직접 써 보세요.')}" ${f?'disabled':''}>${E(s.input)}</textarea><small>${q.type==='list'?'쉼표로 구분해 전부 입력해요. 순서는 상관없어요.':q.keywords?'핵심어 기준 자동 채점이에요. 정답의 의미도 비교해 주세요.':'대소문자와 문장 끝의 마침표는 채점에 영향을 주지 않아요.'}</small>`;
return `<div class="row"><button class="secondary" data-a="home">‹ 나가기</button><small>${E(s.title)}</small><span class="tag">${s.i+1} / ${s.queue.length}</span></div><section class="battle"><div class="row"><span class="health">${'♥'.repeat(s.hp)}${'♡'.repeat(5-s.hp)}</span><span class="combo">${s.combo>=5?'✦ 각성! ':''}${s.combo} COMBO</span></div><div class="fighters"><div class="creature ${s.combo>=5?'glow':''}">${PETS[state.pet][0]}</div><span class="versus">VS</span><div class="creature enemy ${f?'flash':''}">${q.unit==='sentence'?'🐲':'👾'}</div></div><div class="row"><small>${E(PETS[state.pet][1])}</small><small>${E(u[4])}</small></div><div class="bar"><i style="width:${100-progress}%"></i></div></section><section class="card"><div class="row"><span class="tag">${labels[q.type]}</span><small>${s.initial.filter(id=>s.attempts[id]).length}개 도전</small></div><h2 class="question">${E(q.prompt)}</h2>${body}${s.help?`<div class="hint">힌트: ${E(Array.isArray(q.answer)?`${q.answer.length}개예요. 첫 번째는 ${q.answer[0]}`:String(q.answer).split(' ').map(w=>w.slice(0,1)+'_'.repeat(Math.min(5,w.length-1))).join(' '))}</div>`:''}${f?`<div class="feedback ${f.ok?'':'bad'}" id="feedback"><h3>${f.ok?(s.help?'힌트로 성공! 다시 확인해요.':'정답! 기억을 되찾았어요.'):'괜찮아요. 한 번 더 기억해요.'}</h3><div class="solution">${E(answer(q))}</div><p class="explain">${E(q.explain)}</p>${q.keywords?'<small>서술형은 핵심어 기준 자동 채점입니다. 문장 전체 의미를 정답과 비교하세요.</small>':''}<small>${f.rescued?'하트가 모두 회복되었어요. 계속할 수 있어요.':f.ok?`경험치 +${f.xp} · 별조각 +${f.coins}`:s.mode==='exam'?'오답으로 기록했어요.':'뒤에서 이 문제가 다시 나와요.'}</small><button class="primary full" data-a="next">${s.i+1===s.queue.length?'결과 보기':'다음 문제 →'}</button></div>`:`<div class="actions">${s.mode!=='exam'?`<button data-a="hint" ${s.help?'disabled':''}>✧ 힌트</button>`:''}<button class="primary grow" data-a="submit">정답 확인</button><button class="secondary" data-a="reveal">모르겠어요</button></div>`}</section>`;}
//## 변경: 문장, 중복 단어 조립, 다중 선택, 전체 목록, 서술형의 채점 규칙을 구분한다.
function parseList(input,q){let parts=String(input).split(/[,，、;\n·]+/).map(norm).filter(Boolean);const targets=q.answer.map(norm),aliases={};for(const [k,v]of Object.entries(q.aliases||{}))for(const a of v)aliases[norm(a)]=norm(k);if(parts.length===1&&targets.length>1){let rest=' '+norm(input)+' ';const found=[];for(const t of [...targets].sort((a,b)=>b.length-a.length)){if(rest.includes(' '+t+' ')){found.push(t);rest=rest.replace(' '+t+' ',' ');}}if(!rest.trim())parts=found;}return [...new Set(parts.map(p=>aliases[p]||p))];}
function check(q,v){if(q.type==='choice')return v===q.answer;if(q.type==='multi')return Array.isArray(v)&&v.length===q.answer.length&&q.answer.every(x=>v.includes(x));if(q.type==='order')return compact(v)===compact(q.answer);if(q.type==='list'){const a=parseList(v,q),b=q.answer.map(norm);return a.length===b.length&&b.every(x=>a.includes(x));}if(q.keywords)return q.keywords.every(g=>g.some(w=>norm(v).includes(norm(w))));return[q.answer,...q.accept||[]].some(a=>norm(a)===norm(v)||((q.lang==='ko'||String(a).includes('+'))&&compact(a)===compact(v)));}
function value(){const s=state.session,q=current();if(q.type==='choice')return q.options[s.selected[0]];if(q.type==='multi')return s.selected.map(i=>q.options[i]);if(q.type==='order')return s.picked.map(i=>q.tokens[i]).join(' ');return document.getElementById('answer-input')?.value??s.input;}
function submit(reveal=false){const s=state.session,q=current();if(!s||s.feedback)return;const v=value();if(!reveal&&(!v||(Array.isArray(v)&&!v.length)||!String(v).trim())){toast('답을 먼저 골라 주거나 적어 주세요.');return;}if(!reveal&&q.type==='order'&&s.picked.length!==q.tokens.length){toast('모든 단어를 사용해 주세요.');return;}
const ok=!reveal&&check(q,v),first=!s.attempts[q.id],st=state.stats[q.id]||(state.stats[q.id]={done:false,review:false}),xp=ok?(s.help?4:15):0,coins=ok&&!s.help?3:0;s.attempts[q.id]=(s.attempts[q.id]||0)+1;let rescued=false;
if(ok){if(first&&!s.help)s.right++;s.combo++;s.max=Math.max(s.max,s.combo);state.xp+=xp;state.coins+=coins+(s.combo%5===0&&!s.help?3:0);s.earned+=coins;if(!s.help){st.done=true;st.review=false;}if(s.combo%5===0)particles();}else{s.combo=0;s.hp--;if(s.hp<=0){s.hp=5;rescued=true;}}
if(!ok||s.help){st.review=true;if(s.mode!=='exam'&&!s.queue.slice(s.i+1).includes(q.id))s.queue.splice(Math.min(s.i+3,s.queue.length),0,q.id);}
s.feedback={ok,xp,coins,rescued};s.input=typeof v==='string'?v:s.input;save();sound(ok);render();document.getElementById('feedback')?.scrollIntoView({block:'nearest'});}
function next(){const s=state.session;if(!s?.feedback)return;s.i++;if(s.i>=s.queue.length){report={title:s.title,score:Math.round(s.right/s.initial.length*100),right:s.right,total:s.initial.length,max:s.max,coins:s.earned};if(s.mode==='exam')state.best=Math.max(state.best,report.score);state.session=null;save();go('result');particles();return;}prepare();save();render();window.scrollTo(0,0);}
function result(){if(!report)return home();return `<section class="card result"><div class="peticon">🏆</div><h2>${E(report.title)} 완료</h2><div class="score">${report.score}<small>점</small></div><p>첫 시도 · 힌트 없이 정답 ${report.right} / ${report.total}</p><div class="stats"><div><b>${report.max}</b><small>최고 콤보</small></div><div><b>+${report.coins}</b><small>기본 별조각</small></div><div><b>${Q.filter(mastered).length}</b><small>누적 기억</small></div></div><div class="actions"><button class="primary grow" data-a="home">모험 지도</button><button data-a="review">오답 복습</button></div></section>`;}
function bookView(){const sentences=Q.filter(q=>q.fullSentence);return `<h2>암기 도감</h2><p class="note">학습지의 문법·필기·예문을 모았어요. 원문 표현과 뜻풀이·보충 설명을 구분했어요. 사진 원본은 이 대화의 첨부 사진에서 확인하세요.</p><div class="tabs">${UNITS.map(([id,ic,name])=>`<button data-a="tab" data-id="${id}" class="${book===id?'selected':''}">${ic} ${name}</button>`).join('')}</div>${book==='sentence'?sentences.map((q,i)=>`<article class="card sentence"><div class="row"><span class="tag">예문 ${i+1} · ${i<7?'인쇄':'손글씨'}</span><button data-a="speak" data-i="${i}" aria-label="예문 듣기">▷ 듣기</button></div><p>${E(q.prompt.split('\n').slice(1).join('\n'))}</p><details><summary>영어 정답 보기</summary><p class="eng">${E(q.answer)}</p></details></article>`).join(''):`<article class="card bookcard"><h3>${E(UNITS.find(u=>u[0]===book)[2])}</h3><p class="booktext">${hidden?'내용을 가렸어요. 무엇이 있었는지 말해 보세요.':E(BOOK[book])}</p></article>`}<div class="actions"><button data-a="hide">${hidden?'정답 펼치기':'내용 가리기'}</button><button class="primary grow" data-a="${book==='sentence'?'sentence':'unit'}" data-id="${book}">이 내용 도전 →</button></div>`;}
function review(){const list=Q.filter(q=>state.stats[q.id]?.review);return `<h2>오답 구조대 <small>${list.length}개</small></h2><p class="note">틀렸거나 힌트를 사용한 문제예요. 힌트 없이 맞히면 목록에서 빠져요.</p><button class="primary full section" data-a="review-start" ${list.length?'':'disabled'}>오답 다시 도전 →</button>${list.map(q=>`<details class="card bookcard"><summary>${E(q.prompt)}</summary><p class="solution">${E(answer(q))}</p><p class="explain">${E(q.explain)}</p></details>`).join('')||'<div class="card">아직 오답이 없어요. 모험에서 기억을 모아 보세요.</div>'}`;}
function pets(){return `<h2>내 캐릭터</h2><p class="note">정답으로 모은 별조각으로 동료를 열어요. 모두 꾸미기용이며 학습 기능은 동일해요.</p><div class="modes section">${PETS.map(([icon,name,price],i)=>`<button class="card center ${state.pet===i?'selected':''}" data-a="pet" data-i="${i}"><span class="peticon">${icon}</span><h3>${name}</h3><small>${state.pet===i?'함께 모험 중':state.owned.includes(i)?'선택하기':`✧ ${price}개로 열기`}</small></button>`).join('')}</div><button class="full" data-a="sound">효과음 ${state.sound?'켜짐':'꺼짐'} · 눌러서 변경</button><p class="note">학습 기록은 현재 브라우저에 저장됩니다. 개인 정보는 수집하지 않아요.</p><button class="secondary full section" data-a="reset">학습 기록 초기화</button>`;}
//## 변경: 단일 이벤트 위임으로 새 화면에서도 버튼·키보드 입력이 끊기지 않는다.
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,s=state.session,q=current(),i=Number(b.dataset.i);
if(['home','book','review','pets'].includes(a)){save();go(a);return;}
if(a==='main'){if(s)go('play');else start('unit',UNITS.find(u=>Q.some(q=>q.unit===u[0]&&!q.id.startsWith('recall')&&!mastered(q)))?.[0]||'form');return;}
if(a==='unit'){start('unit',b.dataset.id);return;}if(['sentence','exam','raid'].includes(a)){start(a);return;}if(a==='review-start'){start('review');return;}
if(a==='tab'){book=b.dataset.id;hidden=false;render();return;}if(a==='hide'){hidden=!hidden;render();if(book==='sentence')root.querySelectorAll('details').forEach(d=>d.open=!hidden);return;}
if(a==='pet'){if(!state.owned.includes(i)){if(state.coins<PETS[i][2]){toast('별조각이 부족해요. 정답을 맞히면 모여요.');return;}state.coins-=PETS[i][2];state.owned.push(i);}state.pet=i;save();render();return;}
if(a==='sound'){state.sound=!state.sound;save();render();sound(true);return;}
if(a==='reset'){if(confirm('모든 학습 기록과 별조각을 지울까요?')){state=fresh();save();go('home');}return;}
if(a==='speak'){if(!('speechSynthesis'in window)){toast('이 브라우저는 읽어주기를 지원하지 않아요.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(Q.filter(q=>q.fullSentence)[i].answer);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u);return;}
if(!s||!q)return;if(a==='next'){next();return;}if(s.feedback)return;
if(a==='select'){if(q.type==='multi')s.selected=s.selected.includes(i)?s.selected.filter(x=>x!==i):[...s.selected,i];else s.selected=[i];}
else if(a==='pick'){if(!s.picked.includes(i))s.picked.push(i);}else if(a==='unpick')s.picked.splice(i,1);
else if(a==='hint'){s.input=document.getElementById('answer-input')?.value||s.input;s.help=true;}
else if(a==='submit'){submit();return;}else if(a==='reveal'){submit(true);return;}else return;save();render();});
document.addEventListener('input',e=>{if(e.target.id==='answer-input'&&state.session){state.session.input=e.target.value;save();}});
document.addEventListener('keydown',e=>{if(e.isComposing||e.repeat||route!=='play'||!state.session)return;if(e.key==='Enter'&&!e.shiftKey&&e.target.tagName!=='BUTTON'){if(e.target.id==='answer-input'&&current().type==='list'&&!e.ctrlKey&&!e.metaKey)return;e.preventDefault();state.session.feedback?next():submit();}});
window.addEventListener('pagehide',save);render();
//## 변경: 검증용 인터페이스는 테스트 쿼리를 붙인 경우에만 연다.
if(new URLSearchParams(location.search).get('test')==='1')window.__TQ={Q,check,start,submit,next,go,render,get state(){return state;},get current(){return current();},get route(){return route;},get report(){return report;},reset(){state=fresh();save();go('home');},setAnswer(v){const q=current(),s=state.session;if(q.type==='choice')s.selected=[q.options.indexOf(v)];else if(q.type==='multi')s.selected=v.map(x=>q.options.indexOf(x));else if(q.type==='order')s.picked=q.tokens.map((_,i)=>i);else{s.input=v;const el=document.getElementById('answer-input');if(el)el.value=v;}}};
})();
</script></body></html>
